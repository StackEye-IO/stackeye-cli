name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  release:
    name: Build & Release
    runs-on: self-hosted-linux-dfw
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for changelog generation
          clean: true

      # The self-hosted-linux-dfw runner image (T10 migration, #43) never shipped these —
      # every aws s3 step and the apt/rpm gpg2 signing steps fail with "command not found"
      # (stackeye-6095). Installed here, in-job, rather than baking into the shared ARC
      # runner image, since that image is a separate fleet resource this repo doesn't own.
      - name: Install release tooling (aws-cli, gnupg2)
        run: |
          if ! command -v gpg2 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gnupg2 unzip
          fi
          if ! command -v gpg2 >/dev/null 2>&1 && command -v gpg >/dev/null 2>&1; then
            # Some base images ship only `gpg`; goreleaser's signs.cmd and the apt/rpm
            # scripts hardcode `gpg2`, so alias it rather than editing every caller.
            sudo ln -sf "$(command -v gpg)" /usr/local/bin/gpg2
          fi
          if ! command -v aws >/dev/null 2>&1; then
            # `awscli` isn't in this runner's apt sources (no installation candidate),
            # so use the official installer instead of depending on a distro package.
            # AWS doesn't publish the public key at a fetchable URL -- their docs
            # (https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html)
            # have you paste the literal PGP block, so it's committed at
            # .github/aws-cli-pubkey.asc instead. Verified against a job-scoped temp
            # dir (not shared /tmp).
            workdir="${RUNNER_TEMP}/awscli-install"
            mkdir -p "$workdir"
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$workdir/awscliv2.zip"
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip.sig" -o "$workdir/awscliv2.zip.sig"
            gpg --no-default-keyring --keyring "$workdir/aws-keyring.gpg" --import .github/aws-cli-pubkey.asc
            fingerprint=$(gpg --no-default-keyring --keyring "$workdir/aws-keyring.gpg" --with-colons --show-keys .github/aws-cli-pubkey.asc | awk -F: '/^fpr:/ {print $10; exit}')
            if [ "$fingerprint" != "FB5DB77FD5C118B80511ADA8A6310ACC4672475C" ]; then
              echo "::error::AWS CLI signing key fingerprint mismatch: $fingerprint" >&2
              exit 1
            fi
            gpg --no-default-keyring --keyring "$workdir/aws-keyring.gpg" --verify "$workdir/awscliv2.zip.sig" "$workdir/awscliv2.zip"
            unzip -q "$workdir/awscliv2.zip" -d "$workdir"
            sudo "$workdir/aws/install"
            rm -rf "$workdir"
          fi
          aws --version
          gpg2 --version

      - name: Fetch GITOPS_PAT from Vault (keyless OIDC)
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.support.tools
          method: jwt
          path: github-actions
          role: gha-stackeye-cli
          jwtGithubAudience: https://github.com/StackEye-IO
          exportEnv: true
          secrets: |
            secret/data/stackeye/ci/gitops-pat token | GITOPS_PAT

      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          repository: StackEye-IO/stackeye-go-sdk
          path: .sdk
          token: ${{ env.GITOPS_PAT }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Update replace directive for CI
        run: |
          # Point to checked-out SDK instead of sibling directory
          sed -i 's|\.\./stackeye-go-sdk|./.sdk|' go.mod
          go mod tidy

      - name: Download dependencies
        run: go mod download

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        id: goreleaser
        continue-on-error: true  # Continue even if Homebrew tap push fails
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ env.GITOPS_PAT }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ env.GITOPS_PAT }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # goreleaser has continue-on-error above (needed to tolerate the known
      # homebrew-tap/scoop-bucket 403 -- stackeye-6236/task 21418, which happens
      # AFTER the release+checksums exist). But every downstream publish step
      # below only runs `if: hashFiles('dist/checksums.txt') != ''`, which is
      # silently FALSE (skip, not fail) if GoReleaser fails earlier -- e.g. the
      # GitHub Release creation itself fails. That combination let the job report
      # overall success with zero assets published and no release object
      # (stackeye-6292). This step hard-fails the job in that case, before any
      # downstream publish step's hashFiles guard gets a chance to silently skip.
      - name: Assert GoReleaser published a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s dist/checksums.txt ]; then
            echo "::error::GoReleaser failed before producing dist/checksums.txt -- no release was published" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME}"
          asset_count=$(gh release view "${VERSION}" --json assets --jq '.assets | length')
          if [ "${asset_count:-0}" -eq 0 ]; then
            echo "::error::GitHub release ${VERSION} exists but has no assets -- GoReleaser did not publish successfully" >&2
            exit 1
          fi

          echo "Verified release ${VERSION} exists with ${asset_count} assets"

      - name: Upload to Cloudflare R2
        if: always() && hashFiles('dist/checksums.txt') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Get version from tag
          VERSION="${GITHUB_REF_NAME}"

          # Upload archives and checksums to Cloudflare R2 (bucket: stackeye-releases,
          # served publicly at https://releases.stackeye.io via the R2 custom-domain binding).
          # R2 does not implement S3 ACLs -- do NOT add --acl public-read; it is a silent no-op.
          aws s3 cp dist/ "s3://stackeye-releases/cli/${VERSION}/" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" \
            --recursive \
            --exclude "*" \
            --include "*.tar.gz" \
            --include "*.zip" \
            --include "*.deb" \
            --include "*.rpm" \
            --include "*.sig" \
            --include "checksums.txt"

          echo "Uploaded release artifacts to s3://stackeye-releases/cli/${VERSION}/ (served at https://releases.stackeye.io/cli/${VERSION}/)"

      - name: Upload GPG public key to R2
        if: always() && hashFiles('dist/checksums.txt') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          gpg --armor --export "${{ steps.import_gpg.outputs.fingerprint }}" > /tmp/gpg-key.asc
          gpg --export "${{ steps.import_gpg.outputs.fingerprint }}" > /tmp/apt-key.gpg

          aws s3 cp /tmp/gpg-key.asc "s3://stackeye-releases/gpg-key.asc" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" \
            --content-type "text/plain"

          aws s3 cp /tmp/apt-key.gpg "s3://stackeye-releases/apt-key.gpg" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" \
            --content-type "application/octet-stream"

      - name: Build and upload APT repository
        if: always() && hashFiles('dist/checksums.txt') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # dpkg-dev/apt-utils are baked into the runner image (runner:*-arc2).
          chmod +x scripts/build-apt-repo.sh
          ./scripts/build-apt-repo.sh "${GITHUB_REF_NAME}" "${{ steps.import_gpg.outputs.fingerprint }}" dist

          # Clean old pool and upload new (only latest version indexed)
          aws s3 rm "s3://stackeye-releases/pool/" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" --recursive

          aws s3 sync apt-repo/pool/ "s3://stackeye-releases/pool/" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}"

          aws s3 sync apt-repo/dists/ "s3://stackeye-releases/dists/" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" --delete

      - name: Build and upload RPM repository
        if: always() && hashFiles('dist/checksums.txt') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # createrepo-c is baked into the runner image (runner:*-arc2).
          chmod +x scripts/build-rpm-repo.sh
          ./scripts/build-rpm-repo.sh "${GITHUB_REF_NAME}" "${{ steps.import_gpg.outputs.fingerprint }}" dist

          aws s3 sync yum-repo/ "s3://stackeye-releases/yum/" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" --delete

      - name: Upload installer scripts to R2
        if: always() && hashFiles('dist/checksums.txt') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp scripts/install.sh "s3://stackeye-releases/install.sh" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" \
            --content-type "text/plain"

          aws s3 cp scripts/install.ps1 "s3://stackeye-releases/install.ps1" \
            --endpoint-url "${{ secrets.R2_S3_ENDPOINT }}" \
            --content-type "text/plain"

      - name: Purge CloudFlare cache
        if: always() && hashFiles('dist/checksums.txt') != ''
        run: |
          # Purge CDN cache for new release binaries.
          # NOTE: the "prefixes" purge type takes bare host+path, NOT full URLs —
          # a leading https:// makes Cloudflare reject the whole request (error 1119).
          # --fail so a bad/missing token or zone id reddens this step instead of
          # curl silently exiting 0 on a non-2xx response.
          curl --fail -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["releases.stackeye.io/cli/","releases.stackeye.io/dists/","releases.stackeye.io/pool/","releases.stackeye.io/yum/","releases.stackeye.io/gpg-key.asc","releases.stackeye.io/apt-key.gpg","releases.stackeye.io/install.sh","releases.stackeye.io/install.ps1"]}'
