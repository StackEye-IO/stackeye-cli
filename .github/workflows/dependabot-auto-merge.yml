name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: self-hosted-linux-dfw
    # SECURITY-CRITICAL: this is pull_request_target (workflow from `main`, full
    # write perms) on a self-hosted runner — the single most dangerous GitHub
    # Actions trigger/permission/runner combination that exists. This actor
    # guard is the ONLY thing stopping an attacker-authored PR from running
    # with write credentials on our runner. Do NOT weaken it, and do NOT add
    # any step above it (SECURITY: stackeye-6124).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The `gh` CLI is NOT installed on self-hosted-linux-dfw (it only ships on
      # GitHub-hosted images), so `gh pr merge --auto` died with exit 127. Use the
      # enablePullRequestAutoMerge GraphQL mutation via github-script instead — it
      # is Node-based and needs no host binary. Auto-merge still respects branch
      # protection, so nothing merges without its required checks passing.
      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.graphql(
              `mutation($id: ID!) {
                 enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                   pullRequest { number }
                 }
               }`,
              { id: context.payload.pull_request.node_id },
            );
            core.info(`Auto-merge enabled on #${context.payload.pull_request.number}`);
