name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: self-hosted-linux-dfw
    # SECURITY-CRITICAL: this is pull_request_target (workflow from `main`, full
    # write perms) on a self-hosted runner — the single most dangerous GitHub
    # Actions trigger/permission/runner combination that exists. This actor
    # guard is the ONLY thing stopping an attacker-authored PR from running
    # with write credentials on our runner. Do NOT weaken it, and do NOT add
    # any step above it (SECURITY: stackeye-6124).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
